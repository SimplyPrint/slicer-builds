schema_version = 1
name = "QIDIStudio"
repository = "https://github.com/QIDITECH/QIDIStudio.git"
family = "bambu"
executable = "qidi-studio"
architectures = ["x86-64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = ["glfw-x11-bambu-legacy", "cli-thumbnail-glew-glx"]

[ci.binary]
enabled = true
publish = true
release = "latest"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest"
nightly = true
