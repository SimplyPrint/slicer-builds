schema_version = 1
name = "OrcaFlashforge"
repository = "https://github.com/FlashForge/Orca-Flashforge.git"
family = "orca"
executable = "flash-studio"
architectures = ["x86-64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = ["dump-configs-orca-legacy", "glfw-x11-orca-legacy"]

[patches.common_ref_aliases]
"1.7.8" = "1.7.9"

[patches.binary_ref_aliases]
"1.7.8" = "1.7.9"

[ci.binary]
enabled = true
publish = true
release = "latest_tag"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest_tag"
nightly = true
