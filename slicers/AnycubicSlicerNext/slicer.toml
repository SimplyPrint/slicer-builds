schema_version = 1
name = "AnycubicSlicerNext"
repository = "https://github.com/ANYCUBIC-3D/AnycubicSlicerNext.git"
family = "orca"
executable = "orca-slicer"
architectures = ["x86-64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = [
    "dump-configs-orca-legacy",
    "glfw-x11-orca-legacy",
    "glew-glx-orca-legacy",
    "cli-thumbnail-glew-glx",
    "cli-thumbnail-orca-legacy",
    "cli-thumbnail-orca-opengl-version",
]

[ci.binary]
enabled = true
publish = true
release = "latest_tag"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest_tag"
nightly = true
