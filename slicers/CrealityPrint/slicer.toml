schema_version = 1
name = "CrealityPrint"
repository = "https://github.com/CrealityOfficial/CrealityPrint.git"
family = "orca"
gcode_abi = "bambu-profile-gcode/v1"
executable = "CrealityPrint"
architectures = ["x86-64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = ["glfw-x11-orca-legacy", "cli-thumbnail-glew-glx"]

# 7.3.0 rewrote the CLI as a slice-only command without OpenGL thumbnails and
# moved from GLEW to GLAD, so the GL thumbnail patches have nothing to fix.
[[patches.series]]
name = "v7.3"
from = "v7.3.0"
shared = ["glfw-x11-orca-legacy"]

[ci.binary]
enabled = true
publish = true
release = "latest"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest"
nightly = true
required_artifacts = [
    "machine.json",
    "filament.json",
    "process.json",
    "print_config_def.json",
    "ui_metadata.json",
    "translations/_index.json",
]
