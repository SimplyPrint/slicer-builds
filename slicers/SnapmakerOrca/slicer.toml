schema_version = 1
name = "SnapmakerOrca"
repository = "https://github.com/Snapmaker/OrcaSlicer.git"
family = "orca"
gcode_abi = "bambu-profile-gcode/v1"
executable = "snapmaker-orca"
architectures = ["x86-64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = [
    "dump-configs-orca-legacy",
    "glfw-x11-orca-legacy",
    "glew-glx-orca-legacy",
    "cli-thumbnail-glew-glx",
    "cli-thumbnail-orca-legacy",
]

# 2.4.1 is still on OrcaSlicer 2.3, but GLModel gained a VAO path, LOD models
# and a third wxApp GL-version check, and the expand-extruders fix landed upstream.
[[patches.series]]
name = "snapmaker-2.4"
from = "v2.4.1"
shared = [
    "dump-configs-orca-legacy",
    "glfw-x11-orca-legacy",
    "glew-glx-orca-legacy",
    "cli-thumbnail-glew-glx",
]

[ci.binary]
enabled = true
publish = true
release = "latest"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest"
nightly = true
