schema_version = 1
name = "BambuStudio"
repository = "https://github.com/bambulab/BambuStudio.git"
family = "bambu"
gcode_abi = "bambu-profile-gcode/v1"
executable = "bambu-studio"
architectures = ["x86-64", "arm64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = ["ffmpeg-pic-bambu-legacy", "glfw-x11-bambu-legacy", "cli-thumbnail-glew-glx"]

# 02.08.02.60 split init_bed_type_info() around a printer model, which the
# config dump's bed-texture hunks have to follow.
[[patches.series]]
name = "v02.08"
from = "v02.08.02.60"
shared = ["ffmpeg-pic-bambu-legacy", "glfw-x11-bambu-legacy", "cli-thumbnail-glew-glx"]

[ci.binary]
enabled = true
publish = true
release = "latest"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest"
nightly = true
required_artifacts = [
    "machine.json",
    "filament.json",
    "process.json",
    "print_config_def.json",
    "bed_textures.json",
]
