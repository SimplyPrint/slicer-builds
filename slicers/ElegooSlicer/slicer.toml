schema_version = 1
name = "ElegooSlicer"
repository = "https://github.com/ELEGOO-3D/ElegooSlicer.git"
family = "orca"
gcode_abi = "bambu-profile-gcode/v1"
executable = "elegoo-slicer"
architectures = ["x86-64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = [
    "glfw-x11-orca-legacy",
    "glew-glx-orca-legacy",
    "cli-thumbnail-glew-glx",
    "cli-thumbnail-orca-legacy",
]

# v1.5.3.5 rebased onto OrcaSlicer 2.4 (src/ElegooSlicer.cpp, GLFW 3.4 with Wayland).
[[patches.series]]
name = "orca-2.4"
from = "v1.5.3.5"

[ci.binary]
enabled = true
publish = true
release = "latest"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest"
nightly = true
required_artifacts = [
    "machine.json",
    "filament.json",
    "process.json",
    "print_config_def.json",
    "ui_metadata.json",
    "translations/_index.json",
]
