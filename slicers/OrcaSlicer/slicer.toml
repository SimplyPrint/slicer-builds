schema_version = 1
name = "OrcaSlicer"
repository = "https://github.com/OrcaSlicer/OrcaSlicer.git"
family = "orca"
gcode_abi = "bambu-profile-gcode/v1"
executable = "orca-slicer"
architectures = ["x86-64", "arm64"]

[capabilities]
binary = true
config_dump = true
thumbnail = true

[patches]
shared = ["cli-thumbnail-orca-opengl-version"]

[patches.binary_ref_aliases]
"v2.4.1" = "v2.4.2"

# main (2.5.0-dev) requests GL 3.3 itself, so the shared OpenGL version patch is gone.
[[patches.series]]
name = "orca-2.5"
from = "v2.5.0"
shared = []

[ci.binary]
enabled = true
publish = true
release = "latest"
nightly = true

[ci.config]
enabled = true
publish = true
release = "latest"
nightly = true
