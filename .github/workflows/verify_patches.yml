name: Verify Patch Compatibility

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      slicer:
        description: Slicer manifest name, or all
        required: true
        default: all
        type: string
  pull_request:
    paths:
      - ".github/workflows/verify_patches.yml"
      - "patches/**"
      - "slicerctl"
      - "slicers/*/patches/**"
      - "slicers/*/slicer.toml"
      - "tools/slicerctl.py"
      - ".github/scripts/generate_ci_matrix.py"
  push:
    paths:
      - ".github/workflows/verify_patches.yml"
      - "patches/**"
      - "slicerctl"
      - "slicers/*/patches/**"
      - "slicers/*/slicer.toml"
      - "tools/slicerctl.py"
      - ".github/scripts/generate_ci_matrix.py"

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest matrix
        id: generate
        env:
          SELECTED_SLICER: ${{ inputs.slicer || 'all' }}
        run: |
          set -euo pipefail
          inventory=$(./slicerctl list --json)
          if [[ "$SELECTED_SLICER" != "all" ]] && ! jq -e --arg name "$SELECTED_SLICER" 'any(.name == $name)' <<< "$inventory" >/dev/null; then
            echo "Unknown slicer: $SELECTED_SLICER" >&2
            exit 2
          fi
          matrix=$(jq -c --arg name "$SELECTED_SLICER" '{include: [.[] | select($name == "all" or .name == $name) | {slicer: .name}]}' <<< "$inventory")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The scheduled matrices name the exact upstream commit and patch version
      # each build applies, including releases not yet in the index.
      - name: Generate scheduled build targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for lane in binary config; do
            # A disabled lane builds nothing, so it has no stacks to verify.
            if [[ "$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["ci"].get(sys.argv[2], {}).get("enabled", False))' \
              "slicers/${{ matrix.slicer }}/slicer.toml" "$lane")" != True ]]; then
              echo '{"include": []}' > "$RUNNER_TEMP/$lane-matrix.json"
              continue
            fi
            python3 .github/scripts/generate_ci_matrix.py \
              --lane "$lane" \
              --slicer "${{ matrix.slicer }}" \
              --build-type all \
              --arch x86-64 \
              --release-tag "" > "$RUNNER_TEMP/$lane-matrix.json"
          done

      - name: Verify retained and scheduled patch stacks
        run: |
          ./slicerctl verify-patches \
            --slicer "${{ matrix.slicer }}" \
            --binary-matrix "$RUNNER_TEMP/binary-matrix.json" \
            --config-matrix "$RUNNER_TEMP/config-matrix.json" \
            --json
